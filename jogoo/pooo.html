<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Parquímetro</title>
    <link rel="stylesheet" href="stylepoo.css">
</head>
<body>
    <main class="parquimetro-container">
        <h1>Simulador de Parquímetro</h1>
        
        <form id="parquimetro-form">
            <label for="valor-inserido">Valor inserido (R$):</label>
            <input 
                type="number" 
                id="valor-inserido" 
                step="0.05" 
                min="0.00" 
                placeholder="Ex: 3.50" 
                required
            >
            <button type="submit">Calcular Permanência</button>
        </form>

        <div id="resultado" class="resultado hidden">
            <!-- Os resultados serão injetados dinamicamente via JavaScript -->
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
